openapi: 3.1.0
info:
  title: AssetOps API
  version: 0.1.0
  summary: Facility and maintenance management API.
  description: |
    HTTP contract for AssetOps. Every route is mounted under `/api/v1`
    (PRD §7 lists the same paths without the version segment).

    Each operation carries:
    - `x-status`: `implemented` (live today) or `pending` (registered, answers
      `501 NOT_IMPLEMENTED` with `error.details.ticket`).
    - `x-ticket`: backlog ticket in `docs/planning/backlog.md`.
    - `x-roles`: roles allowed by the API permission matrix (ADR-0007). Record-level
      rules (own requests, assigned work, same organization) are enforced in services.

    All responses use the envelope `{ success, data, error, meta? }` (ADR-0006).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5171/api/v1
    description: Local web dev server (Vite proxies /api to the API)
  - url: http://localhost:4101/api/v1
    description: Local API process
tags:
  - name: Health
    description: Liveness and readiness probes (mounted at /api/health, outside /v1).
  - name: Auth
    description: Session authentication and CSRF token issuance.
  - name: Facilities
    description: Organization-scoped facilities and area hierarchy (FR-01).
  - name: Assets
    description: Asset registry and CSV import (FR-02).
  - name: Work orders
    description: Corrective work orders, transitions and technician execution (FR-03, FR-04).
  - name: Maintenance
    description: Preventive maintenance templates, schedules and generation (FR-06).
  - name: Parts
    description: Parts catalogue and append-only stock ledger (FR-07).
  - name: Approvals
    description: Repair approval inbox and decisions (FR-08).
  - name: Reports
    description: Operational reporting and CSV export (FR-09).
  - name: Notifications
    description: In-app notifications (FR-10).
  - name: Audit
    description: Read-only audit log (FR-10).
  - name: SLA
    description: SLA policy configuration (FR-05).
  - name: Organizations
    description: Memberships, organization switching, users and settings (PRD §3).
  - name: Attachments
    description: Local-disk attachments (ADR-0011).

security:
  - sessionCookie: []

paths:
  /health/live:
    servers:
      - url: http://localhost:4101/api
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe (never touches dependencies)
      security: []
      x-status: implemented
      x-ticket: AO-003
      x-roles: [public]
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '429':
          $ref: '#/components/responses/RateLimited'
  /health/ready:
    servers:
      - url: http://localhost:4101/api
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe (checks PostgreSQL)
      security: []
      x-status: implemented
      x-ticket: AO-003
      x-roles: [public]
      responses:
        '200':
          $ref: '#/components/responses/HealthOk'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: Sets the HTTP-only `sid` cookie and returns the CSRF token for later unsafe requests. Rate limited.
      security: []
      x-status: implemented
      x-ticket: AO-002
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Session cookie (`HttpOnly; SameSite=Lax`, `Secure` in production).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current session user and a fresh CSRF token
      x-status: implemented
      x-ticket: AO-002
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: implemented
      x-ticket: AO-002
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          description: Signed out; cookie cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
                            const: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfFailed'
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Signed-in user (PRD `GET /api/auth/me`)
      x-status: implemented
      x-ticket: AO-002
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          description: Session user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /facilities:
    get:
      tags: [Facilities]
      operationId: listFacilities
      summary: List facilities in the caller's organization
      x-status: implemented
      x-ticket: AO-010
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Case-insensitive search on code or name; wildcards are matched literally.
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: Page of facilities ordered by name.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    required: [meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Facility'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Facilities]
      operationId: createFacility
      summary: Create a facility
      description: Writes a `facility.created` audit event in the same transaction.
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: implemented
      x-ticket: AO-010
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFacilityInput'
      responses:
        '201':
          $ref: '#/components/responses/FacilityOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /facilities/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Facilities]
      operationId: getFacility
      summary: Get a facility by id
      description: Unknown ids, malformed ids and ids owned by another organization all return 404.
      x-status: implemented
      x-ticket: AO-010
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          $ref: '#/components/responses/FacilityOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Facilities]
      operationId: updateFacility
      summary: Update or archive a facility (optimistic locking)
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-012
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFacilityInput'
      responses:
        '200':
          $ref: '#/components/responses/FacilityOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /facilities/{id}/areas:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Facilities]
      operationId: listAreas
      summary: Area hierarchy of a facility
      x-status: pending
      x-ticket: AO-013
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          description: Areas (up to three levels).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Area'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Facilities]
      operationId: createArea
      summary: Add an area to a facility
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-013
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaInput'
      responses:
        '201':
          description: Area created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Area'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: Search and filter assets
      x-status: pending
      x-ticket: AO-015
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          description: Search asset code, name or serial number.
          schema:
            type: string
        - name: facilityId
          in: query
          schema:
            type: string
            format: uuid
        - name: criticality
          in: query
          schema:
            $ref: '#/components/schemas/Criticality'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AssetStatus'
      responses:
        '200':
          description: Page of assets.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Asset'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Register an asset
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-015
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          $ref: '#/components/responses/AssetOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /assets/import:
    post:
      tags: [Assets]
      operationId: importAssets
      summary: Preview or commit a CSV asset import
      description: '`mode=preview` validates row by row without writing; `mode=commit` applies all rows in one transaction keyed by asset code.'
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-019
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      parameters:
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [preview, commit]
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        '200':
          description: Import report.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ImportReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /assets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset with derived maintenance metrics
      x-status: pending
      x-ticket: AO-015
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN]
      responses:
        '200':
          $ref: '#/components/responses/AssetOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update an asset (optimistic locking)
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-015
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetInput'
                - $ref: '#/components/schemas/VersionedInput'
      responses:
        '200':
          $ref: '#/components/responses/AssetOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /work-orders:
    get:
      tags: [Work orders]
      operationId: listWorkOrders
      summary: List work orders (requesters see only their own)
      x-status: pending
      x-ticket: AO-023
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/Priority'
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: facilityId
          in: query
          schema:
            type: string
            format: uuid
        - name: sla
          in: query
          schema:
            $ref: '#/components/schemas/SlaClockState'
      responses:
        '200':
          description: Page of work orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkOrder'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Work orders]
      operationId: createWorkOrder
      summary: File a maintenance request
      description: Generates an organization-scoped code and computes SLA due dates from policy.
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-023
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderInput'
      responses:
        '201':
          $ref: '#/components/responses/WorkOrderOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Work orders]
      operationId: getWorkOrder
      summary: Work order detail with timeline, checklist, labor and SLA evaluation
      x-status: pending
      x-ticket: AO-023
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          $ref: '#/components/responses/WorkOrderOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}/transition:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Work orders]
      operationId: transitionWorkOrder
      summary: Change work-order status
      description: |
        Applies the domain state machine (ADR-0013). Actor rules are enforced by the
        domain, not a role gate: domain codes `ROLE_NOT_PERMITTED`, `NOT_ASSIGNEE` and
        `SELF_APPROVAL` map to 403; `INVALID_TRANSITION`, `ORDER_LOCKED`,
        `CHECKLIST_INCOMPLETE`, `RESOLUTION_REQUIRED`, `REASON_REQUIRED`,
        `ASSIGNEE_REQUIRED` and `APPROVAL_REQUIRED` map to 409 `INVALID_STATE_TRANSITION`
        with `details.reason`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-024
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          $ref: '#/components/responses/WorkOrderOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}/assign:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Work orders]
      operationId: assignWorkOrder
      summary: Assign or reassign a technician
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-025
      x-roles: [ORG_ADMIN, FACILITY_MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId, version]
              properties:
                assigneeId:
                  type: string
                  format: uuid
                version:
                  type: integer
                  minimum: 1
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          $ref: '#/components/responses/WorkOrderOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}/checklist/{itemId}/complete:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Work orders]
      operationId: completeChecklistItem
      summary: Mark a checklist item complete
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-026
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN]
      responses:
        '200':
          description: Updated checklist item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChecklistItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}/labor:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Work orders]
      operationId: addLaborEntry
      summary: Record an immutable labor entry (or a correction)
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-027
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaborEntryInput'
      responses:
        '201':
          description: Labor entry recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LaborEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /work-orders/{id}/follow-up:
    parameters:
