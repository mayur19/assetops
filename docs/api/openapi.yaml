        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /organizations/current/users:
    get:
      tags: [Organizations]
      operationId: listOrganizationUsers
      summary: Users and roles in the organization
      x-status: pending
      x-ticket: AO-055
      x-roles: [ORG_ADMIN]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of members.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SessionUser'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Organizations]
      operationId: inviteOrganizationUser
      summary: Add a user to the organization with a role
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-055
      x-roles: [ORG_ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, role]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 200
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /attachments:
    post:
      tags: [Attachments]
      operationId: uploadAttachment
      summary: Upload an attachment (MIME allowlist, size limit)
      security:
        - sessionCookie: []
          csrfToken: []
      x-status: pending
      x-ticket: AO-020
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, entityType, entityId]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                entityType:
                  type: string
                  enum: [asset, work_order]
                entityId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Stored attachment metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccessBase'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /attachments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Attachments]
      operationId: downloadAttachment
      summary: Download an attachment (organization ownership verified)
      x-status: pending
      x-ticket: AO-020
      x-roles: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
      responses:
        '200':
          description: 'File content with Content-Disposition attachment.'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: HTTP-only, SameSite=Lax session cookie set by POST /auth/login (ADR-0005).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: HMAC of the session token returned by /auth/login and /auth/session. Required on authenticated unsafe methods; Origin must also match APP_ORIGIN.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource UUID. Malformed or foreign ids return 404.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    FacilityFilter:
      name: facilityId
      in: query
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key; a replay with the same key returns the original result (planned, AO-042).
      schema:
        type: string
        maxLength: 128

  responses:
    HealthOk:
      description: Healthy.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    type: object
                    required: [status, version]
                    properties:
                      status:
                        type: string
                        enum: [ok, ready]
                      version:
                        type: string
    FacilityOk:
      description: Facility.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Facility'
    AssetOk:
      description: Asset.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'
    WorkOrderOk:
      description: Work order.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkOrder'
    ApprovalOk:
      description: Approval request.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApprovalRequest'
    SettingsOk:
      description: Organization settings.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccessBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizationSettings'
    ValidationFailed:
      description: Request validation failed; `details` lists `{ path, message }` issues.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              details:
                - path: code
                  message: Use 2-20 letters, digits or dashes
              requestId: 3f1c2a9e-6b1d-4c39-9a51-0d7f4c2e8b10
    Unauthenticated:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    Forbidden:
      description: Authenticated but not permitted (role gate or domain actor rule).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    CsrfFailed:
      description: Cross-origin request or missing/invalid CSRF token (`CSRF_FAILED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    NotFound:
      description: Resource does not exist in the caller's organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    Conflict:
      description: Unique constraint, stale version or duplicate active record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    InvalidTransition:
      description: Lifecycle rule rejected the change (`INVALID_STATE_TRANSITION`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
          example:
            success: false
            data: null
            error:
              code: INVALID_STATE_TRANSITION
              message: All required checklist items must be completed
              details:
                reason: CHECKLIST_INCOMPLETE
                missingItemIds: [9b2d1c4e-1f0a-4e6b-8f53-2a7c9d0e1b44]
    RateLimited:
      description: Too many requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    ServiceUnavailable:
      description: Dependency unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
    NotImplemented:
      description: Endpoint is registered but not built yet; `details.ticket` names the backlog item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiFailure'
          example:
            success: false
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Not implemented yet (tracked as AO-023)
              details:
                ticket: AO-023

  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - RATE_LIMITED
        - CSRF_FAILED
        - NOT_IMPLEMENTED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ApiErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details: {}
        requestId:
          type: string
    ApiFailure:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiErrorBody'
    ApiSuccessBase:
      type: object
      required: [success, data, error]
      properties:
        success:
          type: boolean
          const: true
        data: {}
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/PageMeta'
    PageMeta:
      type: object
      required: [total, page, limit]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
    VersionedInput:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock version last read by the client.
    Role:
      type: string
      enum: [ORG_ADMIN, FACILITY_MANAGER, TECHNICIAN, REQUESTER]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required: [id, organizationId, organizationName, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiSuccessBase'
        - type: object
          properties:
            data:
              type: object
              required: [user, csrfToken]
              properties:
                user:
                  $ref: '#/components/schemas/SessionUser'
                csrfToken:
                  type: string
                  minLength: 32
    Membership:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean

    CreateFacilityInput:
      type: object
      required: [code, name, timezone]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{1,19}$'
          description: Trimmed and upper-cased; unique per organization.
          examples: [RIV-SPA]
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
          default: ''
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone name.
          examples: [America/Chicago]
    UpdateFacilityInput:
      allOf:
        - $ref: '#/components/schemas/VersionedInput'
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            address:
              type: string
              maxLength: 500
            timezone:
              type: string
              maxLength: 64
            archived:
              type: boolean
    Facility:
      type: object
      required:
        [
          id,
          organizationId,
          code,
          name,
          address,
          timezone,
          active,
          archivedAt,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: string
        timezone:
          type: string
        active:
          type: boolean
        archivedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    CreateAreaInput:
      type: object
      required: [code, name]
      properties:
        parentAreaId:
          type: [string, 'null']
          format: uuid
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 200
    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        parentAreaId:
          type: [string, 'null']
          format: uuid
        code:
          type: string
        name:
          type: string
        depth:
          type: integer
          minimum: 1
          maximum: 3

    Criticality:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    AssetStatus:
      type: string
      enum: [OPERATIONAL, DEGRADED, DOWN, RETIRED]
    AssetInput:
      type: object
      required: [code, name, category, facilityId, criticality, status]
      properties:
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        make:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        facilityId:
          type: string
          format: uuid
        areaId:
          type: [string, 'null']
          format: uuid
        installedOn:
          type: [string, 'null']
          format: date
        warrantyExpiresOn:
          type: [string, 'null']
          format: date
        criticality:
          $ref: '#/components/schemas/Criticality'
        status:
          $ref: '#/components/schemas/AssetStatus'
        purchasedCostMinor:
          type: [integer, 'null']
          minimum: 0
          description: Integer minor currency units.
    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            repairCount:
              type: integer
            maintenanceCostMinor:
              type: integer
            lastServicedAt:
              type: [string, 'null']
              format: date-time
            version:
              type: integer
    ImportReport:
      type: object
      properties:
        mode:
          type: string
          enum: [preview, commit]
        totalRows:
          type: integer
        validRows:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              field:
                type: string
              message:
                type: string

    WorkOrderStatus:
      type: string
      enum:
        [
          OPEN,
          TRIAGED,
          ASSIGNED,
          IN_PROGRESS,
          AWAITING_PARTS,
          AWAITING_APPROVAL,
          COMPLETED,
          CLOSED,
          CANCELLED,
        ]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    SlaClockState:
      type: string
      enum: [PENDING, AT_RISK, MET, BREACHED, NOT_APPLICABLE]
    SlaClock:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/SlaClockState'
        dueAt:
          type: string
          format: date-time
        stoppedAt:
          type: [string, 'null']
          format: date-time
        consumedBp:
          type: integer
          description: Elapsed share of the budget in basis points.
        remainingMs:
          type: integer
    CreateWorkOrderInput:
      type: object
      required: [title, facilityId, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        facilityId:
          type: string
          format: uuid
        assetId:
          type: [string, 'null']
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        reportedAt:
          type: string
          format: date-time
          description: Incident timestamp; defaults to now.
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sortOrder:
          type: integer
        label:
          type: string
        required:
          type: boolean
        completedBy:
          type: [string, 'null']
          format: uuid
        completedAt:
          type: [string, 'null']
          format: date-time
    WorkOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          examples: [WO-000123]
        facilityId:
          type: string
          format: uuid
        assetId:
          type: [string, 'null']
          format: uuid
        requesterId:
          type: string
          format: uuid
        assignedUserId:
          type: [string, 'null']
          format: uuid
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/WorkOrderStatus'
        title:
          type: string
        description:
          type: string
        resolution:
          type: [string, 'null']
        reportedAt:
          type: string
          format: date-time
        assignedAt:
          type: [string, 'null']
          format: date-time
        firstRespondedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        closedAt:
          type: [string, 'null']
          format: date-time
        responseDueAt:
          type: string
          format: date-time
        resolveDueAt:
          type: string
          format: date-time
        sla:
          type: object
          properties:
            response:
              $ref: '#/components/schemas/SlaClock'
            resolution:
              $ref: '#/components/schemas/SlaClock'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        parentOrderId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
    TransitionRequest:
      type: object
      required: [to, version]
      properties:
        to:
          $ref: '#/components/schemas/WorkOrderStatus'
        version:
          type: integer
          minimum: 1
          description: Optimistic-lock version; a stale version returns 409 CONFLICT.
        note:
          type: string
          maxLength: 2000
        reason:
          type: string
          maxLength: 2000
          description: Required when `to` is CANCELLED.
        resolution:
          type: string
          maxLength: 5000
          description: Required when `to` is COMPLETED unless already stored.
        assigneeId:
          type: string
          format: uuid
          description: Required when `to` is ASSIGNED.
    LaborEntryInput:
      type: object
      required: [minutesSigned]
      properties:
        minutesSigned:
          type: integer
          minimum: -1440
          maximum: 1440
          description: Negative values are corrections of an earlier entry.
        correctsEntryId:
          type: [string, 'null']
          format: uuid
        note:
          type: string
          maxLength: 1000
    LaborEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workOrderId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        minutesSigned:
          type: integer
        rateMinorSnapshot:
          type: [integer, 'null']
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    MaintenanceTemplateInput:
      type: object
      required: [name, defaultPriority]
      properties:
        name:
          type: string
          maxLength: 200
        assetCategory:
          type: [string, 'null']
        assetId:
          type: [string, 'null']
          format: uuid
        checklist:
          type: array
          items:
            type: object
            required: [label, required]
            properties:
              label:
                type: string
              required:
                type: boolean
        estimatedMinutes:
          type: integer
          minimum: 0
        defaultPriority:
          $ref: '#/components/schemas/Priority'
        assigneeRole:
          $ref: '#/components/schemas/Role'
    MaintenanceTemplate:
      allOf:
        - $ref: '#/components/schemas/MaintenanceTemplateInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
    MaintenanceScheduleInput:
      type: object
      required: [templateId, assetId, frequency, startLocalDate, timezone]
      properties:
        templateId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        startLocalDate:
          type: string
          format: date
        timezone:
          type: string
        enabled:
          type: boolean
          default: true
    MaintenanceSchedule:
      allOf:
        - $ref: '#/components/schemas/MaintenanceScheduleInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            nextLocalDate:
              type: string
              format: date

    PartInput:
      type: object
      required: [sku, name, unit]
      properties:
        sku:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 200
        unit:
          type: string
          maxLength: 20
        reorderPoint:
          type: integer
          minimum: 0
        unitCostMinor:
          type: [integer, 'null']
          minimum: 0
        preferredSupplier:
          type: string
    Part:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        unit:
          type: string
        reorderPoint:
          type: integer
        unitCostMinor:
          type: [integer, 'null']
          description: Omitted for roles without inventory:read-pricing.
        balances:
          type: array
          items:
            type: object
            properties:
              facilityId:
                type: string
                format: uuid
              onHandQty:
                type: integer
                minimum: 0
    StockMovementInput:
      type: object
      required: [facilityId, movementType, quantity]
      properties:
        facilityId:
          type: string
          format: uuid
        movementType:
          type: string
          enum: [RECEIPT, ISSUE, RETURN, ADJUSTMENT]
        quantity:
          type: integer
          description: Positive for RECEIPT/ISSUE/RETURN; signed for ADJUSTMENT.
        workOrderId:
          type: [string, 'null']
          format: uuid
        unitCostMinor:
          type: [integer, 'null']
          minimum: 0
        note:
          type: string
    StockMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        partId:
          type: string
          format: uuid
        facilityId:
          type: string
          format: uuid
        workOrderId:
          type: [string, 'null']
          format: uuid
        movementType:
          type: string
          enum: [RECEIPT, ISSUE, RETURN, ADJUSTMENT]
        quantitySigned:
          type: integer
        unitCostMinorSnapshot:
          type: [integer, 'null']
        actorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    PartRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workOrderId:
          type: string
          format: uuid
        partId:
          type: string
          format: uuid
        requestedQty:
          type: integer
        status:
          type: string
          enum: [REQUESTED, APPROVED, ISSUED, REJECTED, CANCELLED]
        requestedBy:
          type: string
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
    ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workOrderId:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        approverId:
          type: [string, 'null']
          format: uuid
        amountMinor:
          type: integer
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        rationale:
          type: string
        comment:
          type: [string, 'null']
        decidedAt:
          type: [string, 'null']
          format: date-time

    OperationsReport:
      type: object
      properties:
        cards:
          type: object
          properties:
            openOrders:
              type: integer
            overdueOrders:
              type: integer
            completedThisMonth:
              type: integer
            lowStockParts:
              type: integer
            responseSlaComplianceBp:
              type: integer
        ordersByStatus:
          type: array
          items:
            type: object
            properties:
              status:
                $ref: '#/components/schemas/WorkOrderStatus'
              count:
                type: integer
        spendTrend:
          type: array
          items:
            type: object
            properties:
              month:
                type: string
              costMinor:
                type: integer
              incomplete:
                type: boolean
                description: True when a labor rate or part cost was missing; never treated as zero.
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ASSIGNMENT, SLA_AT_RISK, SLA_BREACHED, APPROVAL_DECIDED, LOW_STOCK]
        title:
          type: string
        body:
          type: string
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        actorUserId:
          type: [string, 'null']
          format: uuid
        action:
          type: string
          examples: [facility.created]
        entityType:
          type: string
        entityId:
          type: [string, 'null']
        metadata:
          type: object
        requestId:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
    SlaPolicy:
      type: object
      required: [priority, responseMinutes, resolutionMinutes]
      properties:
        priority:
          $ref: '#/components/schemas/Priority'
        facilityId:
          type: [string, 'null']
          format: uuid
          description: Null for the organization default.
        responseMinutes:
          type: integer
          minimum: 1
        resolutionMinutes:
          type: integer
          minimum: 1
    OrganizationSettings:
      type: object
      properties:
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        timezone:
          type: string
        approvalThresholdMinor:
          type: integer
          minimum: 0
        closurePolicy:
          type: string
